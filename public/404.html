<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Dharmic Parents</title>
    <link href="/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-orange-50 via-yellow-50 to-red-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-2xl w-full text-center">
        <!-- Logo -->
        <div class="mb-8">
            <img src="/logo.png" alt="Dharmic Parents Logo" class="w-32 h-32 mx-auto rounded-full shadow-2xl">
        </div>
        
        <!-- Error Message -->
        <div class="bg-white rounded-2xl shadow-2xl p-8 md:p-12">
            <div class="text-6xl md:text-8xl font-bold dharmic-text mb-6">
                404
            </div>
            
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4">
                Page Not Found
            </h1>
            
            <p class="text-gray-600 text-lg mb-8">
                The page you're looking for doesn't exist or has been moved.
            </p>
            
            <!-- Navigation Options -->
            <div class="space-y-4">
                <a href="/" class="inline-block w-full sm:w-auto btn-primary text-white font-bold py-4 px-8 rounded-xl shadow-lg hover:shadow-2xl transition-all">
                    <i class="fas fa-home mr-2"></i>
                    Back to Homepage
                </a>
                
                <div class="flex flex-col sm:flex-row gap-4 justify-center mt-6">
                    <a href="/survey.html" class="text-orange-600 hover:text-orange-700 font-semibold">
                        <i class="fas fa-clipboard-check mr-2"></i>
                        Take Assessment
                    </a>
                    
                    <a href="/about.html" class="text-orange-600 hover:text-orange-700 font-semibold">
                        <i class="fas fa-info-circle mr-2"></i>
                        About Us
                    </a>
                </div>
            </div>
            
            <!-- Support -->
            <div class="mt-12 pt-8 border-t border-gray-200">
                <p class="text-gray-500 text-sm">
                    Need help? <a href="mailto:support@dharmicparents.com" class="text-orange-600 hover:underline">Contact Support</a>
                </p>
            </div>
        </div>
        
        <!-- Quote -->
        <div class="mt-8 text-gray-600 italic">
            "Every setback is a setup for a comeback"
        </div>
    </div>
</body>
</html>
